short_bio: >-
  <div class="media py-1 border-top border-gray"></div>
  <p>
    <b>项目编号：</b> SCP-9341-C
  </p>
  <p> 
    <b>项目等级：</b> Euclid
  </p>
  <p>
    <b>特殊收容措施：</b>SCP-9341-C被收容于Site██内，该设施伪装成一所高中。SCP-9341-C被允许在设施内自由活动，但禁止进入任何违反安全协议的区域。SCP-9341-C处于宿舍内时必须被一名特工监管。房间按照其要求进行布置，包括一张单人床，书架上堆满了数样毛绒玩具和周边手办，内容以《明日方舟》和东方Project居多，也有部分漫画书籍，但是据观察SCP-9341-C并无看书的兴趣。值得注意的是SCP-9341-C被允许在房间内配置一台连接着互联网的计算机，但是被明确禁止其访问[删除]，大多时间SCP-9341-C会使用计算机玩网络游戏或板绘，极少情况会主动学习普通高中课程内容。
    </p>
  <p>
    <b>描述：</b>SCP-9341-C外表看起来为与人类无异，由于其经常于网络冲浪并避免泄漏真名的缘故，其目前会对“C1all0”、“H4kuRei”、“Mavenrick”、“打得好，奖励三遍Little Wish”等昵称做出回应。SCP-9341-C具有让食物消失的能力，该能力可作用于不限于固体和液体食物，不受限于空间限制，当物体被该能力作用后，通常不会留下任何痕迹，被其认为“不可食用”的食品容器则不会出现任何变化。目前我们无法侦测消失的食物去向何处，无论是以高速相机、热成像亦是运动探测器均无得到实质性结果。
  </p>
  <p>
    该能力似乎只作用于被SCP-9341-C观察到并其主观认为可食用的实体有效，我们尚不明确作用条件，SCP-9341-C对于基金会提出的实验[修改]均拒绝配合。在一次测试中，███博士要求其将桌上的苹果吃掉，SCP-9341-C却将其能力作用于一旁直播《舌尖上的中国》节目的电视机画面中的一只烧鸡，嘴角处发现少许残留。
  </p>
  <div class="media py-1 border-top border-gray"></div>
  <p><b>采访SCP-9341-C-1音频记录</b></p>
  <p>[数据删除]</p>
  
